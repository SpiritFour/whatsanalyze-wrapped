name: "Build Frontend"
description: "Setup pnpm, Node.js, install dependencies, and build the Nuxt frontend"

inputs:
  env:
    description: "Environment to build for (dev or prod)"
    required: false
    default: "dev"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "pnpm"
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: frontend
      shell: bash
      run: pnpm install

    - name: Build
      working-directory: frontend
      shell: bash
      run: pnpm run generate
      env:
        NUXT_ENV_ENV: ${{ inputs.env }}
